name: Security Scan
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Scan any branch on demand — e.g. alpha itself, to see what is on it now.
  workflow_dispatch:
jobs:
  scan:
    uses: lenore/lenore-ci/.forgejo/workflows/security.yml@v1
    with:
      dockerfiles: Dockerfile
      # The Vue bundle is baked into the image as minified JS, which an image
      # scan cannot see into, so its lockfile is scanned separately.
      lockfile_dirs: frontend
      # REPORT-ONLY while the existing backlog is worked down (2026-09-11
      # baseline: ~1,600 fixable HIGH/CRITICAL, mostly the 2023 base image).
      # Flip to true — and make the check required in branch protection —
      # once a scan of alpha comes back clean.
      blocking: false
    # No `secrets: inherit`: the scan reads none, and it builds whatever
    # Dockerfile the PR carries, so it should not be handed any.
