site_name: LenoreFin
site_description: A self-hosted personal finance tracker.
site_author: John Adams
site_url: https://novanglus96.github.io/LenoreFin/
repo_url: https://github.com/Novanglus96/LenoreFin
copyright: 2026 John Adams
nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started.md
      - Configuration: configuration.md
  - Features:
      - Accounts: features/accounts.md
      - Transactions: features/transactions.md
      - Budgeting & Planning: features/planning.md
      - Reporting: features/reporting.md
      - Administration: features/administration.md
  - Reference:
      - Models: models.md
      - API: api.md
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
  custom_dir: docs/overrides
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_root_full_path: false
            show_bases: false
            allow_inspection: true
            show_defaults: true
            members:
              - __str__
markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
extra:
  version:
    provider: mike
    default: latest
    alias: true
